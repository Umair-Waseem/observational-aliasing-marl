# Paper source:  docs/paper/template/main.tex  (820 lines, read this phase)
# Repo HEAD:     44a68e29078f801cb6d6b1d2cb82753ae72d81ca  (branch segment2-science)
# Written:       2026-08-03
#
# SOURCING. Every expected_value below was RE-READ from the file it lives in
# during this phase. docs/artifact/PHASE0_AUDIT.md was used only as an index to
# locate candidates; no value was transcribed from it. Where a re-derivation
# disagreed with Phase 0, MY result is recorded and the disagreement is listed
# under DISAGREEMENTS-WITH-PHASE-0 below.
#
# -----------------------------------------------------------------------------
# COUNTS (mine, this phase; machine-verified against this file after writing it)
#   entries in this file .................................. 117
#     of which correspond to a PRINTED value ............... 116
#     of which is a non-printed criterion registered
#       because it is the Q2 answer (table2-retention-
#       third-reading; paper_value: "not printed") ......... 1
#   printed locations named across all paper_location
#     fields (an entry naming n restatements counts n) .... 157
#   match: true ........................................... 111
#   match: false .......................................... 1
#   match: prose_only ..................................... 5
#   expected_value: DERIVED ............................... 6
#   entries carrying a criterion_note ..................... 34
#
# Phase 0 reported "42 traced paper values". My inventory is larger (117) because
# I split every compound cell into one entry per distinct number (Table I's
# "Armed floor + hatch" Role cell alone carries six), and because I included the
# Method/Fig.-1/Fig.-2 caption claims and the reproducibility paragraph in full.
# This is a scope difference, not a contradiction: no value Phase 0 traced is
# absent here.
#
# A SECOND, INDEPENDENT INVENTORY of main.tex run during this phase counted 292
# entries. That is also not a contradiction: it counts every printed NUMERIC
# OCCURRENCE separately (including each restatement in the abstract, the Sec. I
# bullets, Sec. V-D, Sec. VI and the Conclusion), whereas this register uses one
# entry per distinct (criterion, value) CLAIM and names the restatements inside
# paper_location. Both are complete over the same surface; they differ only in
# granularity. Where that inventory found something this register had missed, it
# was added: setup-three-further-mechanisms, method-encoding-radii and
# vi-four-deconfound-reads all entered the file that way, and the first of them
# is the single match: false. The independent pass also reported main.tex as 821
# lines, not 820 — a trailing empty line after \end{document}; immaterial.
#
# -----------------------------------------------------------------------------
# DELIBERATELY EXCLUDED FROM THE REGISTER (and why)
#   * TikZ drawing parameters inside \begin{tikzpicture}..\end{tikzpicture} —
#     line widths, circle radii, \node coordinates, scale factors, shift vectors.
#     82 lines of main.tex are inside tikz environments and were skipped as a
#     block. These are typography, not published values. A coordinate IS
#     registered when it appears in PROSE or a CAPTION as a claim about the
#     environment (for example (3,3), (4,3), (4,4), (0,4)) — those are the
#     fig1-* and vb-* entries.
#   * LaTeX layout numbers: \arraystretch 1.15 / 1.2, p{0.30\columnwidth},
#     p{0.42\columnwidth}, p{0.94\columnwidth}.
#   * Pure notation in the Method equations: the 0 and 1 in max(0, .) and
#     I_{k-1}, and the "c_t >= 0" nonnegativity declaration at main.tex:294.
#     These define the formalism; they are not measurements of this system.
#
# ENTRY CONVENTION
# One entry per distinct (criterion, value) CLAIM. Where the identical value for
# the identical criterion is restated elsewhere (abstract / Sec. I bullets /
# Sec. V-D restating a Table III cell), every location is listed in
# paper_location and the entry is counted once. Every printed number in the
# paper is therefore covered by exactly one entry.
#
# `reads` CONVENTION. The enum is a cost tier for the RECOMPUTATION, not a
# shipping decision. The tier is the SHALLOWEST class of file a verification
# script must open in order to execute this entry's `recompute` formula:
#   analysis_json  — only small, non-bulk files: docs/evidence/*.json,
#                    docs/evidence/*.py, results/experiments/*/RUN_MANIFEST.json,
#                    or a named constant in src/**.py. (The prompt's enum has no
#                    tier for RUN_MANIFEST.json or for src/ constants; both are
#                    small PUBLIC files needing no bulk data, so they sit here.)
#   run_artifacts  — additionally needs bulk run data under
#                    results/experiments/<run>/ (*.jsonl or *.pt).
#   retrain        — not reproducible without running training.
#
# WHAT `reads` DOES NOT TELL YOU. Every one of the 117 entries is analysis_json,
# which is a real and positive finding — the paper's entire numeric surface is
# transcribable or recountable from files in the PUBLIC class alone. It is NOT a
# statement that the underlying grades can be independently CHECKED from the
# shipped artifact. They largely cannot, and two limits are load-bearing:
#   (i)  the pooled bars (BAR-C4, HELD-2 conjuncts a and b) are recomputable from
#        training_curve.jsonl, which is class ZENODO, not GitHub;
#   (ii) EVERY per-mirror value — anchor consolidation, AM-C2, the far-reroute
#        count, the Table II third reading — derives from per-episode
#        scenario_name, which exists ONLY in episode_log.jsonl. I checked the
#        87 keys of training_curve.jsonl this phase: it carries no per-scenario
#        breakdown at all. episode_log.jsonl is classified EXCLUDED (3.10 GiB),
#        so no per-mirror number is independently verifiable from PUBLIC + ADAPT
#        + ZENODO as currently scoped.
# Both are carried into the CLAIM-SOURCE CROSS-CHECK in SHIPPING_MANIFEST.md,
# which is where they should drive a Phase-2 decision.
#
# `match` is a YAML boolean for true/false and the string prose_only; a consumer
# should compare str(entry["match"]).
#
# `match: prose_only` means the value exists in the repository ONLY inside a
# narrative string (a JSON narrative field or a Python docstring), never as a
# dedicated field. The fragment is quoted in field_path.
#
# -----------------------------------------------------------------------------
# EVERY match: false  (1)
#   - setup-three-further-mechanisms   paper says "three further off-by-default
#     mechanisms"; the runs enable a fourth (the DR-H5 movement-recovery gate,
#     seven config keys) plus an advantage std guard, neither named anywhere in
#     the paper, and the recovery gate FIRED on all three RETAIN seeds.
#     Found by an independent trace this phase and verified from source before
#     recording. Full evidence in that entry's criterion_note.
#
# EVERY match: prose_only  (5)
#   - table3-transfer-ci-95            [0.028, 0.600]  narrative JSON string
#   - table3-fisher-p                  0.417           same narrative string
#   - va-armed-five-held-four          5 armed / 4 held  narrative JSON string
#   - fig2-blind-route-mean-hazard     1.0             Python docstring in src/
#   - setup-seed-pool                  101-199         Python docstring in src/
#
# EVERY expected_value: DERIVED  (6)  — each carries derived_from + recompute
#   - table2-anchor-consolidation-n3   3/3
#   - table3-anchor-n3                 3/3
#   - setup-checkpoint-r3750           3750
#   - va-anchor-rerun-witness-9of9     9/9
#   - vb-anchor-exact-interval         [0.40, 0.97]
#   - vb-far-reroute-safe              2/3
#
# -----------------------------------------------------------------------------
# DISAGREEMENTS WITH PHASE 0 (re-derived here; MY result stands)
#
# D-1. Phase 0 (exec summary) said Table II "Retention" has a third reading that
#      is "2/3 -> 2/3, i.e. no effect", comparing the dim-10 field
#      `RETAIN.verdict.am_c2_per_pair_ok_count` (per-PAIR, 2 pairs) against the
#      dim-22 field `tallies.am_c2_per_mirror_all_four_le_05` (per-MIRROR, 4
#      mirrors). Those are NOT the same criterion, so that comparison as stated
#      is not like-for-like. I recomputed the dim-10 arm at per-MIRROR
#      granularity from `t1_d15_analysis.json $.per_layout_split.*` and got
#      2/3 there as well. The "no effect" finding SURVIVES the correction — but
#      it survives for a reason Phase 0 did not state, and it is materially
#      qualified by D-2 below. See Q2 and table2-retention-third-reading.
#
# D-2. Phase 0 did not report that BOTH dim-10 passes of that flat third reading
#      are DEGENERATE. Re-derived here: s139 has hazard 0.0 on all four mirrors
#      because success is 0.0 on all four (absorbing avoid-all); s140 has
#      near-zero hazard because it freezes on two of the four mirrors. A
#      hazard-only criterion is satisfiable by inactivity — the exact vacuity
#      `held2_bar.py` lines 3-6 exist to eliminate. The flat reading is an
#      artifact of the criterion, not evidence of no effect.
#
# D-3. Phase 0 said the printed label of Table III row 1 "alone gives 6/9, not
#      5/9". I re-derived this and CONFIRM 6/9 for a success-only bar. No
#      disagreement — recorded because it is load-bearing (see Q1).
#
# D-5. Phase 0 (§4.3.7) reports the Clopper-Pearson interval for 7/9 as
#      [0.39987, 0.97187]. Two independent recomputations this phase — mine and a
#      second, separate implementation — both give **[0.399906, 0.971855]**,
#      differing from Phase 0 in the fifth decimal at BOTH ends. Both round to the
#      paper's [0.40, 0.97], so the published claim is unaffected; but Phase 0's
#      5-dp figures are not what either recomputation produces, and MY values are
#      what this register records. (Both implementations reproduce CP(2,9) =
#      [0.028145, 0.600094] exactly, which is the control.)
#
# D-6. An independent trace this phase reported that the committed per-seed basin
#      field does NOT sum to the published 4/2/3, giving instead EQ3/OS1/FR3/OTHER2.
#      RESOLVED AGAINST that report: I read the committed field directly and it
#      gives EQUIVARIANT {147,153,157,158} = 4, OVERSHOOT {149,154} = 2, FREEZE
#      {148,155,156} = 3 — exactly the published split, with no OTHER label present.
#      The EQ3/OS1/FR3/OTHER2 figure is what the file's own provenance_note says
#      about an INTERMEDIATE scratchpad artifact (scratchpad/seedscale_basin.json,
#      which is ABSENT from the repo); the report mis-attributed the note's
#      description of that intermediate to the committed field. Consequence: the
#      basin entries stay reads: analysis_json, not run_artifacts. Recorded because
#      a reader of the provenance_note could make the same mistake.
#
# D-4. Phase 0 reported 19 SECTION markers in tests/test_clean.py. I confirm 19,
#      but only after finding that the file uses TWO marker formats
#      (`# ==== SECTION X ====` and a bare `# SECTION XXX -- ...`). A regex
#      matching only the first finds 12 and silently merges seven blocks. This
#      matters for the T1 measurement and is recorded in SHIPPING_MANIFEST.md.
# =============================================================================

