# THE THREE RE-DERIVED QUESTIONS — full answers with the data behind them
# =============================================================================
#
# Q1. Table III row 1, "Task success", n=9 column.
#     Read: t1_seedscale_analysis.json $.per_seed.<seed>.bar_c4_retain, all nine.
#
#       seed | succ     | haz      | pass
#       -----+----------+----------+------
#       147  | 1.0      | 0.0      | True
#       148  | 0.9975   | 0.508125 | False
#       149  | 1.0      | 0.003125 | True
#       153  | 1.0      | 0.00125  | True
#       154  | 0.02     | 0.003125 | False
#       155  | 0.748125 | 0.004375 | False
#       156  | 0.99375  | 0.003125 | True
#       157  | 0.750625 | 0.560625 | False
#       158  | 1.0      | 0.000625 | True
#
#     ANSWER: `pass` is a CONJUNCTION, not a success-only test. s148 is the
#     decisive case: success 0.9975 clears a 0.9 success bar, but hazard
#     0.508125 exceeds 0.5, and pass is false. The grader is
#     held2_bar.py:122 — `c4_pass = c4_succ >= C4_SUCCESS and c4_haz <= C4_HAZARD`
#     with C4_SUCCESS = 0.9 (line 46) and C4_HAZARD = 0.5 (line 47), both over
#     rows[-100:] (line 119). I re-ran held2_bar.held2_verdict on the raw curves
#     of the five row-1 seeds and reproduced every stored succ/haz pair.
#
#     SUCCESS-ALONE across the nine seeds: 6/9 — {147,148,149,153,156,158}.
#     HAZARD-ALONE: 7/9 — {147,149,153,154,155,156,158}.
#     JOINT (printed): 5/9 — {147,149,153,156,158}.
#
#     So the printed label, read literally, names a quantity that is 6/9, while
#     the printed number is the joint 5/9. criterion_note written accordingly on
#     table3-task-success-n9 (and cross-referenced from the n=3 entry).
#
#     A SECOND label imprecision found while doing this: main.tex:525 says
#     "Hazard is graded per-mirror on all four training mirrors", but this row's
#     hazard is POOLED. I verified the pooled value equals the arithmetic mean of
#     the four per-mirror hazards on every seed, and that the pooled and
#     per-mirror readings select the IDENTICAL 7-seed set at n=9, so the
#     imprecision changes no tally here. Recorded, not inflated.
#
# -----------------------------------------------------------------------------
# Q2. Table II, "Retention" column.
#     Candidates readable as "retention" for the {3,4}+{0,3} mixture, with each
#     candidate's value in BOTH arms:
#
#       candidate                                   dim-10   dim-22   direction
#       ------------------------------------------- -------- -------- ---------
#       BAR-C4-RETAIN (pooled tail-100 success>=0.9
#         AND hazard<=0.5)                            0/3      2/3     IMPROVES
#       BAR-C1-HELD-2 full (the core hold)            0/3      2/3     IMPROVES
#       AM-C2 per-mirror hazard <= 0.5 on all four
#         mirrors                                     2/3      2/3     FLAT
#
#     Sources: t1_d15_analysis.json $.RETAIN.verdict.{bar_c4_retain_pass_count,
#     bar_c1_held2_pass_count} and $.per_layout_split.*; t1_retain_analysis.json
#     $.tallies.{bar_c4_retain, bar_c1_held2_full, am_c2_per_mirror_all_four_le_05}
#     and $.per_seed.*.per_mirror.
#
#     ANSWER: NO — the candidates do NOT all show the same direction of effect.
#     Two go 0/3 -> 2/3; the third is flat at 2/3 -> 2/3.
#
#     TWO CORRECTIONS TO HOW THAT FLAT READING SHOULD BE STATED:
#
#     (a) LIKE-FOR-LIKE. The two arms store the third criterion under different
#         names at different granularity: dim-10 has `am_c2_per_pair_ok_count`
#         (per PAIR, 2 pairs) and dim-22 has `am_c2_per_mirror_all_four_le_05`
#         (per MIRROR, 4 mirrors). Comparing those two fields directly is not
#         like-for-like. I recomputed the dim-10 arm at per-MIRROR granularity
#         from $.per_layout_split (which stores all four mirrors):
#           s138 hazards {2.0, 0.0, 0.0, 2.0} -> fails
#           s139 hazards {0.0, 0.0, 0.0, 0.0} -> passes
#           s140 hazards {0.005, 0.0, 0.0, 0.0125} -> passes
#         = 2/3. The flat result SURVIVES the correction.
#
#     (b) THE FLAT READING IS VACUOUS, and this is the substantive point. Both
#         dim-10 passes are degenerate:
#           s139 has hazard 0.0 on all four mirrors because SUCCESS IS 0.0 on all
#                four mirrors — an absorbing avoid-all capture.
#           s140 has near-zero hazard because it FREEZES on two of the four
#                mirrors (success 0.0 on curriculum_r0r3_lower and train_upper).
#         By contrast both dim-22 passes (s147, s149) have success 1.0 on ALL
#         FOUR mirrors with hazard <= 0.0125. The same count sits over
#         categorically different behaviour. A hazard-only criterion is
#         satisfiable by inactivity — precisely the vacuity that held2_bar.py's
#         own docstring (lines 3-6) records HELD-2 as having been introduced to
#         eliminate, after T1-D10 satisfied the hazard-only conjuncts with
#         success 0.000 on all three seeds.
#
#     criterion_note written on table2-retention-third-reading, which is
#     registered even though it is not printed, so the flat reading is on the
#     record rather than discoverable only by someone who goes looking.
#
# -----------------------------------------------------------------------------
# Q3. Table III rows 1 and 2, independence.
#
#     Row 1 (Task success, BAR-C4-RETAIN) passing set: {147, 149, 153, 156, 158}
#     Row 2 (Selective-sensing hold, HELD-2)   passing set: {147, 149, 153, 158}
#
#     ANSWER: row 2 is a STRICT SUBSET of row 1. The single seed in the gap is
#     s156. (At n=3 the two sets are equal, {147,149}, so the containment is only
#     visible at n=9.)
#
#     WHY s156 SPLITS THEM — recomputed from the raw curve this phase via
#     held2_bar.held2_verdict(load_run_curve('t1_seedscale_s156')):
#       BAR-C4  tail-100 success 0.9938, hazard 0.0031          -> PASS
#       HELD-2  (a) joint occupancy 0.4100                      -> FAIL (< 0.85)
#       HELD-2  (b) worst 50-round window success 0.7350        -> FAIL (< 0.75)
#     i.e. a run that recovered into a good final 100 rounds but was unstable
#     across the wider 500-round tail. My recomputation reproduced the stored
#     held2_full booleans on all five row-1 seeds exactly (4 true, 1 false).
#
#     IS THE CONTAINMENT STRUCTURAL? Reading the grader (docs/evidence/held2_bar.py):
#       * Both bars apply the SAME two thresholds — success >= 0.9 (OCCUPANCY_SUCCESS
#         :37 / C4_SUCCESS :46) and hazard <= 0.5 (OCCUPANCY_HAZARD :38 /
#         C4_HAZARD :47) — to the SAME two per-round curve quantities
#         (success_rate, hazard_cost_sum_mean).
#       * BAR-C4's window, rows[-100:] (:119), is a SUBSET of HELD-2's window
#         [3500, 4000) (:76).
#       * HELD-2 additionally requires the conjunction to hold PER ROUND on >= 85%
#         of the wider window, plus two-sided relapse windows, plus an external
#         causal witness.
#     So the two rows share a conjunct and HELD-2 is strictly more demanding on
#     it — the containment is a shared-conjunct effect, not independence.
#
#     BUT IT IS NOT A LOGICAL IMPLICATION. I constructed a counterexample and ran
#     it through the actual grader: a 4000-round curve with success 1.0
#     throughout and hazard 0.70 on exactly 75 rounds placed inside the final 100
#     (rounds 3900-3974), hazard 0.0 elsewhere. Result:
#       held2_a_joint_occupancy 0.85  -> (a) PASS (exactly at the bar)
#       held2_b_worst_window_hazard 0.70 -> (b) PASS (below 0.75)
#       held2_ab_pass TRUE
#       bar_c4_tail100_hazard 0.525   -> BAR-C4 FAIL
#     HELD-2 (a)+(b) can therefore pass while BAR-C4 fails. The nesting observed
#     at n=9 is empirical, driven by the shared conjunct, not guaranteed by
#     construction.
#
#     CONSEQUENCE FOR READING THE TABLE: rows 1 and 2 are not independent
#     evidence. "Task success 5/9 and the hold 4/9" describes one nested family,
#     not two agreeing measurements — the four holding seeds are four of the five
#     succeeding seeds. criterion_note written on table3-hold-n9.
# =============================================================================
