- id: setup-three-further-mechanisms
  paper_location: "Sec. IV (main.tex:551-552)"
  printed_label: "Beyond Table~I, every reported run enables three further off-by-default mechanisms"
  criterion: "The number of off-by-default mechanisms, beyond the Table I corridor, that the reported runs actually enable."
  criterion_note: "THE ONE match: false IN THIS REGISTER. The paragraph goes on to name exactly three - potential-based shaping, the sensing keep-alive, and the entropy floors. Diffing the nine runs' config against the driver's own dataclass defaults (src/raas_marl/final_training/stage25_driver.py, Stage25RunConfig) shows 32 keys set away from an OFF default. Twenty-five of those are disclosed (13 by Table I, 5 by the entropy-sustain schedule, 7 by the three named mechanisms). SEVEN are not disclosed anywhere in the paper: movement_recovery_gate=true plus its six midband_recovery_* parameters - the DR-H5 lever-K movement-recovery gate - and separately advantage_std_guard_threshold=1e-06. The words 'midband' and 'containment' appear ZERO times in main.tex, and all six occurrences of 'recovery' describe the RESULT (recovery of the behavior) or the s147 arm-then-recovery episode, never the lever. The mechanism is not inert: t1_retain_analysis.json $.lever_k_now_tested records it FIRING on all three RETAIN seeds (s147 twice, s148 once, s149 once, with named round ranges). So the published count of three is an undercount of what the runs behind Table II's dim-22 row and Table III's n=3 column enabled."
