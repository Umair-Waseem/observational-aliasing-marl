name: CI

# =============================================================================
# WHICH STEPS ARE BLOCKING, AND WHY
#
# Read this before adding `continue-on-error` to anything, or removing it.
#
# THIS WORKFLOW HAS NOW BEEN EXECUTED, AND THE HEADER BELOW IS THE PRE-EXECUTION
# ANALYSIS IT REPLACES. It ran for the first time on the release push to the
# public repository, on ubuntu-latest, and EVERY STEP PASSED -- including the
# three whose Linux behaviour this file said was unverified: the blocking pytest
# step (1539 passed), the provenance gate, and the four self-contained
# instrument modes. The caveats below are therefore now measurements rather than
# arguments, and are kept because the reasoning is what licensed the step
# classification, not because the doubt survives.
#
# What was true when it was written, and is preserved for the record: the
# machine that built this artifact runs Windows and has no Docker, no WSL and no
# `act`, so a Linux run was attempted there and found impossible. Every
# judgement below rested on Windows execution plus analysis, and the analysis
# was stated as analysis.
#
# That matters more here than in a typical repository, because every
# RUN_MANIFEST.json in this artifact records
# `cross_platform_bitwise_determinism_claimed: false`, the recorded platform is
# Windows-11 / AMD64, and the test suite makes bitwise and 0.0-error assertions.
# The artifact does not claim its numbers reproduce bit-for-bit on another
# platform, so a step asserting them cannot be made blocking on ubuntu-latest
# without first observing it pass there.
#
# THE RULE APPLIED: a step is blocking only where its outcome is
# platform-independent by construction, or where it was already blocking before
# this pass. Nothing was PROMOTED to blocking on the strength of analysis alone.
#
#   blocking      checkout, setup-python, torch pin + assertion, install, ruff,
#                 pytest
#   non-blocking  mypy, provenance gate, the four self-contained instruments
#
# WHAT WAS MEASURED ON WINDOWS (all green): ruff clean; pytest 1539 passed; the
# provenance gate passing with 110 artifact-owned module resolutions and zero
# resolving outside the repository; all four instrument steps below passing. The
# suite was additionally re-run at OMP/MKL thread counts 1, 2 and 8 and at two
# PYTHONHASHSEED values -- 1539 passed in all five -- which exercises the BLAS
# reduction-order and dict-ordering mechanisms most likely to differ on Linux.
# Strong evidence, and it turned out to be right: the ubuntu-latest run described
# at the top of this file passed every one of those steps.
#
# THE ONE CHANGE THAT WOULD SETTLE THIS is at the bottom of this file: a
# two-runner matrix. It is written out and commented, deliberately not enabled,
# because choosing the runner set is the authors' call and not a lint fix.
# =============================================================================

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 3.12 is the minor version the nine graded runs actually executed on:
      # every one of their RUN_MANIFEST.json runtime_record blocks records
      # python_version "3.12.10 ... [MSC v.1943 64 bit (AMD64)]".
      #
      # The floor is >=3.12 and that is now MEASURED rather than inherited. A
      # Python 3.10 environment was built and the suite run in it: 1416 passed,
      # 112 failed, 11 errors -- and all 123 failures share ONE root, a circular
      # import inside torch 2.5.1's own `torch.onnx._internal.diagnostics.infra
      # .sarif` package. `python3.10 -c "import torch.onnx"` reproduces it with
      # no artifact code involved at all, and the same import succeeds on 3.12.
      # No artifact code imports torch.onnx. So the constraint is a property of
      # the pinned DEPENDENCY on 3.10, not of this package -- but the declared
      # floor governs the installable artifact including that pin, so >=3.12 is
      # both correct and now evidenced.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PINNED to the exact recorded build. runtime_record.torch_version is
      # "2.5.1+cpu" in all nine graded manifests, and runtime_record.device is
      # "cpu". The pin is load-bearing, not cosmetic: this suite makes bitwise,
      # 0.0-error and seeded-determinism assertions, so a silently drifting
      # numerical backend is a real hazard. Measured while writing this file, the
      # UNPINNED form `pip install torch --index-url .../cpu` resolves to
      # torch 2.13.0+cpu -- eight minor versions past the recorded build, which
      # `dependencies = ["torch>=2.5.1"]` would happily accept. Installing from
      # the CPU index also avoids the multi-gigabyte CUDA wheel that is the
      # default on Linux.
      - name: Install PyTorch (CPU build, pinned to the recorded version)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; assert torch.__version__.startswith('2.5.1'), torch.__version__; print('torch', torch.__version__)"

      # EDITABLE install, deliberately. The source repository declares no
      # packaging at all and reaches the package purely by putting <root>/src on
      # sys.path -- tests/conftest.py does this at sys.path[0], and two of the
      # five grading instruments do the same. A NON-editable install would place
      # a second copy of raas_marl in site-packages while conftest.py kept
      # inserting <repo>/src ahead of it. Installing editable makes the PEP 660
      # finder map raas_marl -> <repo>/src/raas_marl: the same files, one copy,
      # both mechanisms agreeing. See the comment block in pyproject.toml.
      - name: Install the project (editable) and dev tooling
        run: python -m pip install -e ".[dev]"

      - name: Show resolved environment
        run: |
          python -c "import sys, torch, raas_marl; print('python', sys.version); print('torch', torch.__version__); print('raas_marl', raas_marl.__file__)"

      # BLOCKING. Ruff's verdict is a pure function of the source text and the
      # configuration; it cannot differ by platform. Verified clean on Windows
      # with zero findings, including with every per-file-ignore stripped for
      # the rules this pass fixed.
      - name: Lint (ruff)
        run: ruff check .

      # NOT BLOCKING -- AND THE EARLIER PROMISE TO MAKE IT BLOCKING IS WITHDRAWN.
      #
      # A previous version of this file said "PHASE 3 REMOVES continue-on-error
      # AND MAKES THIS BLOCKING." That promise was made before anyone had run
      # mypy. It has now been run: 92 errors across 23 files.
      #
      # They are NOT missing annotations, and the annotation pass did not create
      # them. 48 of them are [arg-type] with one recurring shape: this codebase
      # validates HOSTILE INPUT at run time rather than trusting a static type, so
      # a validator takes `object` precisely because its job is to accept anything
      # and reject what is wrong -- e.g. `int.__index__(value)` on a parameter
      # annotated `object`, deliberately, so an int SUBCLASS cannot smuggle a
      # different value past a bound check. mypy cannot see the narrowing the
      # previous line performed. The errors are a true statement about what mypy
      # can prove and a false statement about whether the code is correct.
      #
      # Clearing them would mean ~92 `# type: ignore` comments or a rewrite of the
      # validation architecture, in files whose byte-identity to the research
      # repository IS this artifact's provenance guarantee. Making the step
      # blocking would simply turn CI red on the first push for reasons unrelated
      # to any defect.
      #
      # What IS enforced instead, and does pass clean: annotation completeness on
      # the public API surface, via the strict per-module override in
      # pyproject.toml ([[tool.mypy.overrides]], disallow_untyped_defs). Every
      # public function a reader calls declares its types.
      - name: Type-check (mypy)
        continue-on-error: true
        run: mypy

      # BLOCKING -- and the one step whose Linux behaviour is genuinely unverified.
      # It was already blocking before this pass, so leaving it blocking is not a
      # promotion; removing it would weaken the workflow. If it fails on the first
      # ubuntu run, read the failure before changing anything here: the likely
      # candidates are documented in that phase's report, and the honest responses
      # are a runner matrix or a marked test subset, NOT a loosened assertion.
      #
      # `-o addopts=""` clears the `-q` in pyproject's addopts. Without it, CI
      # passes a second `-q`, and doubly-quiet pytest suppresses the very summary
      # line ("1539 passed") a CI log exists to show.
      - name: Test
        run: pytest tests/ -o addopts="" -p no:cacheprovider -q

      # BLOCKING, and blocking on the same ground as ruff: the outcome is
      # platform-independent by construction. The three modules under
      # instruments/ are standard library only -- no torch, no scipy, no
      # network -- and they read shipped JSON and do exact integer and
      # floating-point arithmetic on it. There is no BLAS reduction order and no
      # dict-iteration dependence for a platform to change. This step is also
      # the release's central promise made executable: it recomputes the four
      # n=9 reliability rates, their exact Clopper-Pearson intervals, the
      # reroute-basin partition and the arm-fire Fisher p-value from the shipped
      # records, and exits non-zero if any of them stops matching the paper.
      - name: Reproduce Table III from the shipped records
        run: |
          python -m instruments.reproduce_table3
          python - <<'PY'
          # The claim above rests on these modules importing nothing but the
          # standard library, so assert it rather than asserting it in prose.
          import ast, pathlib, sys
          stdlib = sys.stdlib_module_names
          bad = []
          for f in sorted(pathlib.Path("instruments").glob("*.py")):
              tree = ast.parse(f.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:          # relative: a sibling instrument
                          continue
                      names = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  bad += [(f.name, n) for n in names if n and n not in stdlib]
          if bad:
              print("NOT standard-library-only:", bad); raise SystemExit(1)
          print("instruments/: standard library only, verified by AST.")
          PY

      # NOT BLOCKING -- never executed on Linux (see the header).
      #
      # This is the gate that proves each grading instrument loads raas_marl, and
      # its sibling harness, from THIS repository. It exists because three of the
      # five instruments used to bootstrap off a hardcoded absolute path naming a
      # private research tree; on the machine where that tree existed they loaded
      # from it even when run inside a clone, so a green instrument run was
      # evidence about a directory the reader does not have. The paths are gone;
      # this keeps them gone, and is a positive test of provenance rather than a
      # grep for one string that a different absolute path would slip past.
      #
      # Windows result: PASS, 110 artifact-owned module resolutions across the
      # five instruments, none resolving outside the repository. The detector was
      # also shown non-vacuous -- pointed at the research repository's unmodified
      # copy of an instrument it reports 27 violations.
      - name: Provenance gate (every instrument loads from THIS repository)
        continue-on-error: true
        run: python scripts/check_provenance.py

      # NOT BLOCKING -- never executed on Linux (see the header).
      #
      # These four are the instrument modes that need NO Zenodo-class data: two
      # run entirely on synthetic fixtures, and two are self-validating modes that
      # grade the scripted comparators. All four pass on Windows.
      #
      # NOTE ON held2_bar --validate: it exits 0 while SKIPPING three real-curve
      # regressions when the curves are absent, which is the normal state here.
      # Those three are the decisive HELD-1-vacuity regressions, so it now prints a
      # DEGRADED banner and says so in its summary line. Read the log; a green tick
      # on that step does not mean full coverage.
      #
      # The three FULL modes -- held2_bar --grade-run, c1_selectivity_harness
      # --grade-run, and drh5_trigger_regression -- are deliberately ABSENT. They
      # need training_curve.jsonl or state_round_*.pt from the Zenodo data record.
      # Each now explains that instead of raising a traceback.
      - name: Grading instruments (self-contained modes only)
        continue-on-error: true
        run: |
          python docs/evidence/r2_null_rejection_check.py
          python docs/evidence/c1_tightened_adversarial_test.py
          python docs/evidence/held2_bar.py --validate
          python docs/evidence/c1_selectivity_harness.py --validate --fork

# =============================================================================
# THE RECOMMENDED NEXT CHANGE -- deliberately NOT applied here.
#
# Replace the `runs-on: ubuntu-latest` above with the matrix below. It costs one
# line and converts every "we could not test this on Linux" caveat in this file
# into a measurement on the first push, while keeping windows-latest -- the
# platform the reported runs were actually produced on -- as a controlled
# comparison. If the suite passes on both, the mypy/provenance/instrument steps
# can be made blocking on evidence rather than argument.
#
# It is left commented because choosing the runner set is an authors' decision,
# and because a phase that could not run Linux should not quietly change what
# Linux does.
#
#    strategy:
#      fail-fast: false
#      matrix:
#        os: [ubuntu-latest, windows-latest]
#    runs-on: ${{ matrix.os }}
# =============================================================================
