name: CI



on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      
      - name: Install PyTorch (CPU build, pinned to the recorded version)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; assert torch.__version__.startswith('2.5.1'), torch.__version__; print('torch', torch.__version__)"

      
      - name: Install the project (editable) and dev tooling
        run: python -m pip install -e ".[dev]"

      - name: Show resolved environment
        run: |
          python -c "import sys, torch, raas_marl; print('python', sys.version); print('torch', torch.__version__); print('raas_marl', raas_marl.__file__)"

      
      - name: Lint (ruff)
        run: ruff check .

     
      - name: Type-check (mypy)
        continue-on-error: true
        run: mypy

      
      - name: Test
        run: pytest tests/ -o addopts="" -p no:cacheprovider -q

      
      - name: Reproduce Table III from the shipped records
        run: |
          python -m instruments.reproduce_table3
          python - <<'PY'
          # The claim above rests on these modules importing nothing but the
          # standard library, so assert it rather than asserting it in prose.
          import ast, pathlib, sys
          stdlib = sys.stdlib_module_names
          bad = []
          for f in sorted(pathlib.Path("instruments").glob("*.py")):
              tree = ast.parse(f.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:          # relative: a sibling instrument
                          continue
                      names = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  bad += [(f.name, n) for n in names if n and n not in stdlib]
          if bad:
              print("NOT standard-library-only:", bad); raise SystemExit(1)
          print("instruments/: standard library only, verified by AST.")
          PY

     
      - name: Provenance gate (every instrument loads from THIS repository)
        continue-on-error: true
        run: python scripts/check_provenance.py

   
      - name: Grading instruments (self-contained modes only)
        continue-on-error: true
        run: |
          python docs/evidence/r2_null_rejection_check.py
          python docs/evidence/c1_tightened_adversarial_test.py
          python docs/evidence/held2_bar.py --validate
          python docs/evidence/c1_selectivity_harness.py --validate --fork


